[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-detector-humanizer"
version = "1.0.0"
description = "AI text detector (percentage + confidence) and humanizer"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Jimit Devangkumar Parikh" }]

[project.urls]
Homepage = "https://github.com/JIMIT-PARIKH-01/ai-detector-humanizer"

[project.scripts]
ai-text-toolkit = "ai_text_toolkit.cli:main"

[tool.setuptools]
packages = ["ai_text_toolkit"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
